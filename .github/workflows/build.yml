name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Android64

      - uses: actions/upload-artifact@v4
        with:
          name: keyviewer-android64
          path: ${{ steps.build.outputs.build-output }}
